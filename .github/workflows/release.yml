name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release CLI Jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Validate public-safe repository hygiene
        run: bash scripts/validate-public-hygiene.sh

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck

      - name: Build executable CLI jar
        run: ./gradlew :cli:executableJar

      - name: Smoke-run executable CLI jar
        run: java -jar cli/build/libs/agent-desk-cli-all.jar

      - name: Upload executable CLI jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-desk-cli-all
          path: cli/build/libs/agent-desk-cli-all.jar
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              cli/build/libs/agent-desk-cli-all.jar \
              --clobber

            release_body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
            if [ -z "$release_body" ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$GITHUB_REF_NAME" \
                --jq .body > release-notes.md
              gh release edit "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" \
                --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              cli/build/libs/agent-desk-cli-all.jar \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
