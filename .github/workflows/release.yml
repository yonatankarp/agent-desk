name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer segment to increment.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Release CLI Jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Validate public-safe repository hygiene
        run: bash scripts/validate-public-hygiene.sh

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck

      - name: Build executable CLI jar
        run: ./gradlew :cli:executableJar

      - name: Smoke-run executable CLI jar
        run: java -jar cli/build/libs/agent-desk-cli-all.jar

      - name: Validate release branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Run releases from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Resolve next release version
        id: version
        uses: reecetech/version-increment@2024.10.1
        with:
          scheme: semver
          increment: ${{ inputs.bump }}

      - name: Upload executable CLI jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-desk-cli-all
          path: cli/build/libs/agent-desk-cli-all.jar
          if-no-files-found: error

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.v-version }}
        run: |
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEXT_TAG" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$NEXT_TAG" \
            -f sha="$GITHUB_SHA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.v-version }}
        run: |
          gh release create "$NEXT_TAG" \
            cli/build/libs/agent-desk-cli-all.jar \
            --title "$NEXT_TAG" \
            --generate-notes \
            --verify-tag
