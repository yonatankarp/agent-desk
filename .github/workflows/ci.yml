name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate public-safe repository hygiene
        run: bash scripts/validate-public-hygiene.sh

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck

  gradle:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Build core module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :core

      - name: Build CLI module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :cli

      - name: Build desktop module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :desktop

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Generate core coverage reports
        run: ./gradlew :core:koverXmlReport :core:koverHtmlReport

      - name: Upload core coverage report
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-report
          path: |
            core/build/reports/kover/**
          if-no-files-found: error

      - name: Add coverage summary
        run: |
          echo "Core coverage reports uploaded as artifact: core-coverage-report" >> "$GITHUB_STEP_SUMMARY"
          echo "Local command: ./gradlew :core:koverXmlReport :core:koverHtmlReport" >> "$GITHUB_STEP_SUMMARY"

  dependabot:
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    uses: yonatankarp/github-actions/.github/workflows/dependabot-auto-merge.yml@v2
    secrets:
      GITHUB_PAT: ${{ secrets.CI_PAT }}
