name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate public-safe repository hygiene
        run: bash scripts/validate-public-hygiene.sh

      - name: Run public hygiene self-test
        run: bash scripts/validate-public-hygiene.sh --self-test

  smoke-scripts:
    name: Smoke Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Run mock runtime smoke
        run: bash scripts/mock-runtime-smoke.sh

      - name: Run mobile read-only smoke
        run: bash scripts/mobile-read-only-smoke.sh

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck

  gradle:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Build core module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :core

      - name: Build app module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :app

      - name: Build CLI module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :cli

      - name: Build desktop module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :desktop

      - name: Build mobile module
        uses: yonatankarp/github-actions/.github/actions/gradle-build@v2
        with:
          gradle-module: :mobile

  macos-compose:
    name: macOS Compose Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Build Compose desktop and mobile modules
        run: ./gradlew :desktop:build :mobile:build

  windows-compose:
    name: Windows Compose Build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Build Compose desktop and mobile modules
        run: ./gradlew.bat :desktop:build :mobile:build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare JVM build
        uses: yonatankarp/github-actions/.github/actions/prepare-jvm-build@v2
        with:
          jvm-version: "25"

      - name: Generate module coverage reports
        run: |
          ./gradlew \
            :core:koverXmlReport :core:koverHtmlReport \
            :app:koverXmlReport :app:koverHtmlReport \
            :cli:koverXmlReport :cli:koverHtmlReport \
            :desktop:koverXmlReport :desktop:koverHtmlReport \
            :mobile:koverXmlReport :mobile:koverHtmlReport

      - name: Upload core coverage report
        uses: actions/upload-artifact@v7
        with:
          name: core-coverage-report
          path: |
            core/build/reports/kover/**
          if-no-files-found: error

      - name: Upload app coverage report
        uses: actions/upload-artifact@v7
        with:
          name: app-coverage-report
          path: |
            app/build/reports/kover/**
          if-no-files-found: error

      - name: Upload cli coverage report
        uses: actions/upload-artifact@v7
        with:
          name: cli-coverage-report
          path: |
            cli/build/reports/kover/**
          if-no-files-found: error

      - name: Upload desktop coverage report
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-report
          path: |
            desktop/build/reports/kover/**
          if-no-files-found: error

      - name: Upload mobile coverage report
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage-report
          path: |
            mobile/build/reports/kover/**
          if-no-files-found: error

      - name: Generate coverage summary
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def percentage(covered, missed):
              total = covered + missed
              if total == 0:
                  return "n/a"
              return f"{covered / total * 100:.2f}%"

          def module_summary(module):
              report_path = Path(module) / "build/reports/kover/report.xml"
              root = ET.parse(report_path).getroot()
              counters = {
                  counter.attrib["type"]: (
                      int(counter.attrib["covered"]),
                      int(counter.attrib["missed"]),
                  )
                  for counter in root.findall("counter")
              }
              rows = []
              for counter_type in ("LINE", "BRANCH", "INSTRUCTION", "METHOD", "CLASS"):
                  covered, missed = counters[counter_type]
                  rows.append(
                      f"| {counter_type.title()} | {percentage(covered, missed)} | {covered} | {missed} |"
                  )
              return [
                  f"### :{module}",
                  "",
                  "| Metric | Coverage | Covered | Missed |",
                  "| --- | ---: | ---: | ---: |",
                  *rows,
                  "",
                  f"Artifact: `{module}-coverage-report`",
                  f"Local command: `./gradlew :{module}:koverXmlReport :{module}:koverHtmlReport`",
                  "",
              ]

          summary = "\n".join(
              [
                  "<!-- agent-desk:coverage-summary -->",
                  "## Coverage",
                  "",
                  "Report-only coverage for testable modules.",
                  "",
                  *module_summary("core"),
                  *module_summary("app"),
                  *module_summary("cli"),
                  *module_summary("desktop"),
                  *module_summary("mobile"),
                  "",
              ]
          )
          Path("coverage-summary.md").write_text(summary, encoding="utf-8")
          PY

      - name: Add coverage summary to workflow run
        if: ${{ github.event_name != 'pull_request' }}
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage-summary.md
          if-no-files-found: error

  coverage-comment:
    name: Coverage Comment
    runs-on: ubuntu-latest
    needs: coverage
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: coverage-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary

      - name: Comment coverage summary on pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- agent-desk:coverage-summary -->';
            const body = fs.readFileSync('coverage-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              ['github-actions', 'github-actions[bot]'].includes(comment.user?.login) &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  dependabot:
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    uses: yonatankarp/github-actions/.github/workflows/dependabot-auto-merge.yml@v2
    secrets:
      GITHUB_PAT: ${{ secrets.CI_PAT }}
